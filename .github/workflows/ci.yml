name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & unit test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # --build-tags functional is a superset of the default build (it only adds files
      # gated behind //go:build functional, e.g. examples/*/*_functional_test.go; it
      # never excludes untagged files), so this one invocation lints everything.
      - name: Lint
        run: go tool golangci-lint run --build-tags functional ./...

  functional-test:
    name: Functional tests
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start MySQL and Postgres
        run: docker compose up -d --wait --wait-timeout 120

      - name: Functional tests
        run: go test -tags functional -v ./examples/...

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop databases
        if: always()
        run: docker compose down
