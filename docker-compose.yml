services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: simplesql
      MYSQL_DATABASE: simplesql
      MYSQL_USER: simplesql
      MYSQL_PASSWORD: simplesql
    ports:
      - "33066:3306"
    volumes:
      - ./examples/schema/mysql.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psimplesql"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: simplesql
      POSTGRES_USER: simplesql
      POSTGRES_PASSWORD: simplesql
    ports:
      - "54322:5432"
    volumes:
      - ./examples/schema/postgres.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplesql -d simplesql"]
      interval: 2s
      timeout: 2s
      retries: 30
